name: دریافت پست‌های تلگرام

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: نصب کتابخانه‌ها
        run: |
          pip install requests jdatetime beautifulsoup4
      
      - name: دریافت پست‌های واقعی از تلگرام
        run: |
          python3 << 'EOF'
          import json, requests, os, re, time
          from bs4 import BeautifulSoup
          from datetime import datetime
          import jdatetime
          
          # ===========================================
          # کانال‌های خودت رو اینجا بنویس
          CHANNELS = ["rodast_omiddana", "iliaen", "proxy_kafee", "alonews"]
          # ===========================================
          
          os.makedirs("data/posts", exist_ok=True)
          
          def clean_text(text):
              if not text:
                  return ""
              # حذف HTML تگ‌ها
              text = re.sub(r'<[^>]+>', ' ', text)
              text = re.sub(r'\s+', ' ', text)
              return text.strip()
          
          def get_views(views_elem):
              if not views_elem:
                  return "0"
              text = views_elem.text.strip()
              # تبدیل 1.5K به 1500
              if 'K' in text or 'k' in text:
                  try:
                      num = float(re.findall(r'[\d\.]+', text)[0])
                      return str(int(num * 1000))
                  except:
                      return text
              return text
          
          def extract_reactions(msg):
              """استخراج ری‌اکشن‌ها از پیام - روش جدید"""
              reactions = []
              # ری‌اکشن‌ها در div با کلاس tgme_widget_message_reactions
              reactions_div = msg.select_one('.tgme_widget_message_reactions')
              if reactions_div:
                  reaction_items = reactions_div.select('.tgme_widget_message_reaction')
                  for react in reaction_items:
                      emoji_elem = react.select_one('.tgme_widget_message_reaction_emoji')
                      count_elem = react.select_one('.tgme_widget_message_reaction_count')
                      
                      if emoji_elem:
                          # استخراج ایموجی از text یا data-attribute
                          emoji = emoji_elem.get('data-emoji', '')
                          if not emoji:
                              emoji = emoji_elem.text.strip()
                          count = count_elem.text.strip() if count_elem else "1"
                          if emoji:
                              reactions.append({"emoji": emoji, "count": count})
              return reactions
          
          def extract_images(msg):
              """استخراج عکس‌ها از پیام"""
              images = []
              
              # روش 1: عکس‌های معمولی
              photo_div = msg.select_one('.tgme_widget_message_photo')
              if photo_div:
                  # لینک عکس با کیفیت بالا از style یا src
                  img = photo_div.select_one('img')
                  if img:
                      src = img.get('src', '')
                      # لینک عکس با کیفیت بالا
                      if src and 'user_photo' not in src and 'emoji' not in src:
                          # تبدیل به لینک با کیفیت بالا
                          high_quality = src.replace('//cdn5.telegram-cdn.org', '//cdn5.telesco.pe')
                          images.append(high_quality)
                  
                  # روش جایگزین: از data-zoom
                  zoom_link = photo_div.get('data-zoom', '')
                  if zoom_link and 'user_photo' not in zoom_link:
                      images.append(zoom_link)
              
              # روش 2: عکس‌های گروهی (گالری)
              photo_wraps = msg.select('.tgme_widget_message_photo_wrap')
              for pw in photo_wraps:
                  style = pw.get('style', '')
                  # استخراج لینک از background-image
                  url_match = re.search(r'url\(["\']?([^"\'\)]+)["\']?\)', style)
                  if url_match:
                      img_url = url_match.group(1)
                      if 'user_photo' not in img_url and 'emoji' not in img_url:
                          images.append(img_url)
              
              return list(dict.fromkeys(images))  # حذف تکراری‌ها
          
          def extract_videos(msg):
              """استخراج ویدیوها از پیام"""
              videos = []
              video_div = msg.select_one('.tgme_widget_message_video')
              if video_div:
                  video_elem = video_div.select_one('video')
                  if video_elem:
                      src = video_elem.get('src', '')
                      if src:
                          videos.append(src)
                  
                  # لینک جایگزین
                  video_link = video_div.get('data-video', '')
                  if video_link:
                      videos.append(video_link)
              return videos
          
          def extract_gifs(msg):
              """استخراج گیف‌ها (انیمیشن) از پیام"""
              gifs = []
              gif_div = msg.select_one('.tgme_widget_message_animation')
              if gif_div:
                  video_elem = gif_div.select_one('video')
                  if video_elem:
                      src = video_elem.get('src', '')
                      if src:
                          gifs.append(src)
              return gifs
          
          for channel in CHANNELS:
              print(f"📡 در حال دریافت: {channel}")
              url = f"https://t.me/s/{channel}"
              
              try:
                  headers = {
                      'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
                      'Accept-Language': 'en-US,en;q=0.9',
                      'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8'
                  }
                  response = requests.get(url, timeout=30, headers=headers)
                  response.raise_for_status()
                  
                  soup = BeautifulSoup(response.text, 'html.parser')
                  posts = []
                  messages = soup.select('.tgme_widget_message')
                  
                  print(f"   تعداد پیام‌های پیدا شده: {len(messages)}")
                  
                  for idx, msg in enumerate(messages[:25]):
                      # زمان
                      time_elem = msg.select_one('time')
                      time_str = ""
                      if time_elem:
                          datetime_attr = time_elem.get('datetime', '')
                          if datetime_attr:
                              try:
                                  dt = datetime.fromisoformat(datetime_attr.replace('Z', '+00:00'))
                                  jd = jdatetime.datetime.fromgregorian(datetime=dt)
                                  time_str = f"{jd.year}/{jd.month}/{jd.day} - {jd.hour:02d}:{jd.minute:02d}"
                              except:
                                  time_str = time_elem.text
                          else:
                              time_str = time_elem.text
                      
                      # متن
                      text_elem = msg.select_one('.tgme_widget_message_text')
                      text = clean_text(text_elem.text) if text_elem else ""
                      
                      # بازدید
                      views_elem = msg.select_one('.tgme_widget_message_views')
                      views = get_views(views_elem)
                      
                      # ری‌اکشن‌ها
                      reactions = extract_reactions(msg)
                      
                      # عکس‌ها
                      images = extract_images(msg)
                      
                      # ویدیوها
                      videos = extract_videos(msg)
                      
                      # گیف‌ها
                      gifs = extract_gifs(msg)
                      
                      # فقط پست‌هایی که محتوا دارن ذخیره کن
                      if text or images or videos or gifs:
                          posts.append({
                              "id": len(posts) + 1,
                              "time": time_str,
                              "text": text,
                              "views": views,
                              "reactions": reactions,
                              "images": images,
                              "videos": videos,
                              "gifs": gifs
                          })
                          print(f"   پست {len(posts)}: متن={bool(text)}, عکس={len(images)}, ویدیو={len(videos)}, ری‌اکشن={len(reactions)}")
                      
                      if len(posts) >= 20:
                          break
                  
                  output = {
                      "channel": channel,
                      "last_update": datetime.now().strftime("%Y-%m-%d %H:%M:%S"),
                      "posts": posts
                  }
                  
                  with open(f"data/posts/{channel}.json", "w", encoding="utf-8") as f:
                      json.dump(output, f, ensure_ascii=False, indent=2)
                  
                  print(f"✅ {channel}: {len(posts)} پست ذخیره شد")
                  print(f"   - عکس‌ها: {sum(len(p['images']) for p in posts)}")
                  print(f"   - ویدیوها: {sum(len(p['videos']) for p in posts)}")
                  print(f"   - ری‌اکشن‌ها: {sum(len(p['reactions']) for p in posts)}")
                  print("")
                  
              except Exception as e:
                  print(f"❌ خطا در {channel}: {str(e)}")
                  print("")
          
          # ذخیره لیست کانال‌ها
          channels_list = {
              "channels": [
                  {"id": ch, "name": ch} for ch in CHANNELS
              ]
          }
          
          with open("data/channels.json", "w", encoding="utf-8") as f:
              json.dump(channels_list, f, ensure_ascii=False, indent=2)
          
          print("\n🎉 همه چیز با موفقیت انجام شد!")
          EOF
      
      - name: ذخیره در گیت‌هاب
        run: |
          git config user.name "github-actions[bot]"
          git config.user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "به‌روزرسانی خودکار پست‌ها" || echo "تغییری وجود ندارد"
          git push
