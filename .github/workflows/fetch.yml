name: دریافت پست‌های تلگرام

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: نصب کتابخانه‌ها
        run: |
          pip install requests jdatetime beautifulsoup4 lxml
      
      - name: دریافت پست‌های واقعی از تلگرام
        run: |
          python3 << 'EOF'
          import json, requests, os, re, time
          from bs4 import BeautifulSoup
          from datetime import datetime
          import jdatetime
          
          # ===========================================
          CHANNELS = ["rodast_omiddana", "iliaen", "proxy_kafee", "alonews"]
          # ===========================================
          
          os.makedirs("data/posts", exist_ok=True)
          
          def clean_text(text):
              if not text:
                  return ""
              # حذف تگ‌های HTML و نرمال‌سازی فاصله‌ها
              text = re.sub(r'<[^>]+>', ' ', text)
              text = re.sub(r'\s+', ' ', text)
              return text.strip()
          
          def fix_date(date_str):
              """تبدیل تاریخ‌های ناقص مثل '0:12' به تاریخ کامل"""
              if not date_str:
                  return ""
              # اگر فقط ساعت دارد (مثل "0:12")
              if re.match(r'^\d{1,2}:\d{2}$', date_str):
                  now = jdatetime.datetime.now()
                  return f"{now.year}/{now.month}/{now.day} - {date_str}"
              return date_str
          
          def get_views(views_elem):
              if not views_elem:
                  return "0"
              text = views_elem.text.strip()
              # تبدیل 1.5K به 1500
              match = re.search(r'([\d\.]+)(K|k)?', text)
              if match:
                  num = float(match.group(1))
                  if match.group(2) in ('K', 'k'):
                      return str(int(num * 1000))
                  return str(int(num))
              return text
          
          def extract_reactions(msg):
              reactions = []
              reactions_div = msg.select_one('.tgme_widget_message_reactions')
              if reactions_div:
                  for react in reactions_div.select('.tgme_widget_message_reaction'):
                      emoji_elem = react.select_one('.tgme_widget_message_reaction_emoji')
                      count_elem = react.select_one('.tgme_widget_message_reaction_count')
                      if emoji_elem:
                          # استخراج ایموجی از text یا data-emoji
                          emoji = emoji_elem.get('data-emoji', '') or emoji_elem.text.strip()
                          count = count_elem.text.strip() if count_elem else "1"
                          if emoji:
                              reactions.append({"emoji": emoji, "count": count})
              return reactions
          
          def extract_images(msg):
              images = []
              # عکس اصلی
              photo_div = msg.select_one('.tgme_widget_message_photo')
              if photo_div:
                  # از src تصویر
                  img = photo_div.select_one('img')
                  if img and img.get('src'):
                      src = img['src']
                      if 'user_photo' not in src and 'emoji' not in src:
                          images.append(src.replace('//cdn5.telegram-cdn.org', '//cdn5.telesco.pe'))
                  
                  # از data-zoom (کیفیت بالا)
                  zoom = photo_div.get('data-zoom', '')
                  if zoom and 'user_photo' not in zoom:
                      images.append(zoom)
              
              # عکس‌های گروهی (گالری)
              for pw in msg.select('.tgme_widget_message_photo_wrap'):
                  # از background-image
                  style = pw.get('style', '')
                  match = re.search(r'url\(["\']?([^"\'\)]+)["\']?\)', style)
                  if match:
                      img_url = match.group(1)
                      if 'user_photo' not in img_url and 'emoji' not in img_url:
                          images.append(img_url)
                  
                  # از data-webp (کیفیت بالا)
                  webp = pw.get('data-webp', '')
                  if webp and 'user_photo' not in webp:
                      images.append(webp)
              
              return list(dict.fromkeys(images))  # حذف تکراری‌ها
          
          def extract_videos(msg):
              videos = []
              video_div = msg.select_one('.tgme_widget_message_video')
              if video_div:
                  # از تگ video
                  video = video_div.select_one('video')
                  if video and video.get('src'):
                      videos.append(video['src'])
                  
                  # از data-video
                  video_link = video_div.get('data-video', '')
                  if video_link:
                      videos.append(video_link)
              return videos
          
          def extract_gifs(msg):
              gifs = []
              gif_div = msg.select_one('.tgme_widget_message_animation')
              if gif_div:
                  video = gif_div.select_one('video')
                  if video and video.get('src'):
                      gifs.append(video['src'])
              return gifs
          
          for channel in CHANNELS:
              print(f"📡 در حال دریافت: {channel}")
              url = f"https://t.me/s/{channel}"
              
              try:
                  headers = {
                      'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
                      'Accept-Language': 'en-US,en;q=0.9',
                  }
                  response = requests.get(url, timeout=30, headers=headers)
                  response.raise_for_status()
                  
                  soup = BeautifulSoup(response.text, 'lxml')
                  posts = []
                  messages = soup.select('.tgme_widget_message')
                  
                  print(f"   یافت شد: {len(messages)} پیام")
                  
                  for msg in messages[:25]:
                      # زمان
                      time_elem = msg.select_one('time')
                      time_str = ""
                      if time_elem:
                          dt_attr = time_elem.get('datetime', '')
                          if dt_attr:
                              try:
                                  dt = datetime.fromisoformat(dt_attr.replace('Z', '+00:00'))
                                  jd = jdatetime.datetime.fromgregorian(datetime=dt)
                                  time_str = f"{jd.year}/{jd.month}/{jd.day} - {jd.hour:02d}:{jd.minute:02d}"
                              except:
                                  time_str = time_elem.text
                          else:
                              time_str = time_elem.text
                      
                      # اصلاح تاریخ‌های ناقص
                      time_str = fix_date(time_str)
                      
                      # متن
                      text_elem = msg.select_one('.tgme_widget_message_text')
                      text = clean_text(text_elem.text) if text_elem else ""
                      
                      # بازدید
                      views_elem = msg.select_one('.tgme_widget_message_views')
                      views = get_views(views_elem)
                      
                      # ری‌اکشن
                      reactions = extract_reactions(msg)
                      
                      # عکس و ویدیو و گیف
                      images = extract_images(msg)
                      videos = extract_videos(msg)
                      gifs = extract_gifs(msg)
                      
                      if text or images or videos or gifs:
                          posts.append({
                              "id": len(posts) + 1,
                              "time": time_str,
                              "text": text,
                              "views": views,
                              "reactions": reactions,
                              "images": images,
                              "videos": videos,
                              "gifs": gifs
                          })
                      
                      if len(posts) >= 20:
                          break
                  
                  # ذخیره در فایل
                  output = {
                      "channel": channel,
                      "last_update": datetime.now().strftime("%Y-%m-%d %H:%M:%S"),
                      "posts": posts
                  }
                  
                  with open(f"data/posts/{channel}.json", "w", encoding="utf-8") as f:
                      json.dump(output, f, ensure_ascii=False, indent=2)
                  
                  print(f"✅ {channel}: {len(posts)} پست ذخیره شد")
                  print(f"   عکس: {sum(len(p['images']) for p in posts)}")
                  print(f"   ویدیو: {sum(len(p['videos']) for p in posts)}")
                  print(f"   ری‌اکشن: {sum(len(p['reactions']) for p in posts)}")
                  print("")
                  
              except Exception as e:
                  print(f"❌ خطا در {channel}: {str(e)}")
                  print("")
          
          # ذخیره لیست کانال‌ها
          channels_list = {"channels": [{"id": ch, "name": ch} for ch in CHANNELS]}
          with open("data/channels.json", "w", encoding="utf-8") as f:
              json.dump(channels_list, f, ensure_ascii=False, indent=2)
          
          print("🎉 همه چیز با موفقیت انجام شد!")
          EOF
      
      - name: ذخیره در گیت‌هاب
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "به‌روزرسانی خودکار پست‌ها" || echo "تغییری وجود ندارد"
          git push
