name: دریافت پست‌های تلگرام

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: نصب کتابخانه‌ها
        run: |
          pip install playwright requests jdatetime
          python -m playwright install chromium
          python -m playwright install-deps chromium
      
      - name: دریافت پست‌های واقعی از تلگرام
        run: |
          python3 << 'EOF'
          import asyncio
          import json
          import os
          import re
          import time
          import hashlib
          from pathlib import Path
          from datetime import datetime
          from urllib.parse import urlparse
          
          import jdatetime
          import requests
          from playwright.async_api import async_playwright
          
          # ===========================================
          CHANNELS = ["rodast_omiddana", "iliaen", "proxy_kafee", "alonews"]
          # ===========================================
          
          # ساخت پوشه‌ها
          POSTS_DIR = Path("data/posts")
          MEDIA_DIR = Path("data/media")
          POSTS_DIR.mkdir(parents=True, exist_ok=True)
          MEDIA_DIR.mkdir(parents=True, exist_ok=True)
          
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          }
          
          def download_media(url, channel_name, post_id, media_type='photo'):
              """دانلود عکس یا ویدیو و ذخیره در پوشه media"""
              if not url:
                  return None
              
              # تولید نام فایل یکتا
              ext_map = {'photo': '.jpg', 'video': '.mp4'}
              ext = ext_map.get(media_type, '.jpg')
              
              # استفاده از هش برای نام فایل (مثل اسکریپت اصلی)
              url_hash = hashlib.md5(url.encode()).hexdigest()[:8]
              filename = f"{channel_name}_{post_id}_{url_hash}{ext}"
              local_path = MEDIA_DIR / filename
              
              # اگه فایل قبلاً دانلود شده، فقط مسیر رو برگردون
              if local_path.exists():
                  return f"data/media/{filename}"
              
              try:
                  resp = requests.get(url, headers=HEADERS, timeout=30)
                  resp.raise_for_status()
                  
                  # اصلاح پسوند بر اساس Content-Type
                  content_type = resp.headers.get('Content-Type', '').lower()
                  if 'image/jpeg' in content_type and not filename.endswith('.jpg'):
                      filename = filename.replace('.jpg', '.jpg')
                  elif 'image/png' in content_type:
                      filename = filename.replace('.jpg', '.png')
                  elif 'video/mp4' in content_type:
                      filename = filename.replace('.mp4', '.mp4')
                  elif 'video/webm' in content_type:
                      filename = filename.replace('.mp4', '.webm')
                  
                  local_path = MEDIA_DIR / filename
                  local_path.write_bytes(resp.content)
                  print(f"      📥 دانلود شد: {filename}")
                  return f"data/media/{filename}"
                  
              except Exception as e:
                  print(f"      ⚠️ خطا در دانلود: {e}")
                  return None
          
          def clean_text(text):
              if not text:
                  return ""
              text = re.sub(r'\s+', ' ', text)
              return text.strip()
          
          async def scrape_channel(channel_name):
              print(f"📡 در حال دریافت: {channel_name}")
              url = f"https://t.me/s/{channel_name}"
              
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True)
                  page = await browser.new_page()
                  
                  await page.goto(url, wait_until="networkidle", timeout=30000)
                  
                  try:
                      await page.wait_for_selector("[data-post]", timeout=15000)
                  except:
                      print(f"   ❌ پیامی پیدا نشد")
                      await browser.close()
                      return []
                  
                  # اسکرول برای لود بیشتر (مثل اسکریپت اصلی)
                  for _ in range(8):
                      await page.evaluate("window.scrollTo(0, document.body.scrollHeight)")
                      await asyncio.sleep(2)
                  
                  # استخراج داده‌ها با جاوااسکریپت داخل مرورگر
                  messages_data = await page.evaluate("""() => {
                      const messages = [];
                      const containers = document.querySelectorAll('[data-post]');
                      
                      containers.forEach(el => {
                          const dataPost = el.getAttribute('data-post');
                          if (!dataPost) return;
                          const parts = dataPost.split('/');
                          if (parts.length < 2) return;
                          const channel = parts[0];
                          const postId = parseInt(parts[1]);
                          if (isNaN(postId)) return;
                          
                          // زمان
                          const timeEl = el.querySelector('time');
                          let timeStr = '';
                          if (timeEl) {
                              const dt = timeEl.getAttribute('datetime');
                              if (dt) timeStr = dt;
                              else timeStr = timeEl.innerText;
                          }
                          
                          // متن
                          const textEl = el.querySelector('.tgme_widget_message_text');
                          const text = textEl ? textEl.innerText : '';
                          
                          // بازدید
                          const viewsEl = el.querySelector('.tgme_widget_message_views');
                          let views = '0';
                          if (viewsEl) views = viewsEl.innerText;
                          
                          // عکس‌ها (از background-image)
                          const images = [];
                          const photoWrap = el.querySelector('.tgme_widget_message_photo_wrap');
                          if (photoWrap) {
                              const style = photoWrap.getAttribute('style') || '';
                              const match = style.match(/url\\(['"]?(.*?)['"]?\\)/);
                              if (match) images.push(match[1]);
                          }
                          
                          // عکس از تگ img
                          const imgTag = el.querySelector('.tgme_widget_message_photo img');
                          if (imgTag && imgTag.src) {
                              images.push(imgTag.src);
                          }
                          
                          // ویدیوها
                          const videos = [];
                          const videoTag = el.querySelector('video');
                          if (videoTag && videoTag.src && !videoTag.src.startsWith('blob:')) {
                              videos.push(videoTag.src);
                          }
                          
                          // ویدیو از data-video
                          const videoWrap = el.querySelector('.tgme_widget_message_video');
                          if (videoWrap) {
                              const dataVideo = videoWrap.getAttribute('data-video');
                              if (dataVideo) videos.push(dataVideo);
                          }
                          
                          // ری‌اکشن‌ها
                          const reactions = [];
                          const reactionDivs = el.querySelectorAll('.tgme_widget_message_reaction');
                          reactionDivs.forEach(react => {
                              const emojiEl = react.querySelector('.tgme_widget_message_reaction_emoji');
                              const countEl = react.querySelector('.tgme_widget_message_reaction_count');
                              if (emojiEl) {
                                  reactions.push({
                                      emoji: emojiEl.innerText,
                                      count: countEl ? countEl.innerText : '1'
                                  });
                              }
                          });
                          
                          messages.push({
                              id: postId,
                              time: timeStr,
                              text: text,
                              views: views,
                              images: images,
                              videos: videos,
                              reactions: reactions
                          });
                      });
                      
                      return messages;
                  }""")
                  
                  await browser.close()
                  
                  print(f"   یافت شد: {len(messages_data)} پیام")
                  return messages_data
          
          def convert_time(dt_str):
              if not dt_str:
                  return ""
              try:
                  dt = datetime.fromisoformat(dt_str.replace('Z', '+00:00'))
                  jd = jdatetime.datetime.fromgregorian(datetime=dt)
                  return f"{jd.year}/{jd.month}/{jd.day} - {jd.hour:02d}:{jd.minute:02d}"
              except:
                  return dt_str
          
          async def main():
              for channel in CHANNELS:
                  raw_messages = await scrape_channel(channel)
                  
                  posts = []
                  for msg in raw_messages[:25]:
                      # دانلود عکس‌ها
                      downloaded_images = []
                      for img_url in msg.get('images', []):
                          if img_url and 'user_photo' not in img_url:
                              local_path = download_media(img_url, channel, msg['id'], 'photo')
                              if local_path:
                                  downloaded_images.append(local_path)
                      
                      # دانلود ویدیوها
                      downloaded_videos = []
                      for vid_url in msg.get('videos', []):
                          if vid_url:
                              local_path = download_media(vid_url, channel, msg['id'], 'video')
                              if local_path:
                                  downloaded_videos.append(local_path)
                      
                      posts.append({
                          "id": msg["id"],
                          "time": convert_time(msg["time"]),
                          "text": clean_text(msg["text"]),
                          "views": msg["views"],
                          "reactions": msg.get("reactions", []),
                          "images": downloaded_images,
                          "videos": downloaded_videos,
                          "gifs": []
                      })
                      
                      if downloaded_images:
                          print(f"      ✅ {len(downloaded_images)} عکس ذخیره شد")
                      if downloaded_videos:
                          print(f"      ✅ {len(downloaded_videos)} ویدیو ذخیره شد")
                  
                  output = {
                      "channel": channel,
                      "last_update": datetime.now().strftime("%Y-%m-%d %H:%M:%S"),
                      "posts": posts
                  }
                  
                  with open(POSTS_DIR / f"{channel}.json", "w", encoding="utf-8") as f:
                      json.dump(output, f, ensure_ascii=False, indent=2)
                  
                  print(f"✅ {channel}: {len(posts)} پست ذخیره شد")
                  print(f"   عکس: {sum(len(p['images']) for p in posts)}")
                  print(f"   ویدیو: {sum(len(p['videos']) for p in posts)}")
                  print(f"   ری‌اکشن: {sum(len(p['reactions']) for p in posts)}")
                  print("")
              
              # ذخیره لیست کانال‌ها
              channels_list = {"channels": [{"id": ch, "name": ch} for ch in CHANNELS]}
              with open("data/channels.json", "w", encoding="utf-8") as f:
                  json.dump(channels_list, f, ensure_ascii=False, indent=2)
              
              print("🎉 همه چیز با موفقیت انجام شد!")
          
          asyncio.run(main())
          EOF
      
      - name: ذخیره در گیت‌هاب
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "به‌روزرسانی خودکار پست‌ها" || echo "تغییری وجود ندارد"
          git push
