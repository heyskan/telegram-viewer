name: دریافت پست‌های تلگرام

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: نصب کتابخانه‌ها
        run: |
          pip install requests jdatetime beautifulsoup4 lxml
      
      - name: دریافت پست‌های واقعی از تلگرام
        run: |
          python3 << 'EOF'
          import json, requests, os, re
          from bs4 import BeautifulSoup
          from datetime import datetime
          import jdatetime
          
          # ===========================================
          CHANNELS = ["rodast_omiddana", "iliaen", "proxy_kafee", "alonews"]
          # ===========================================
          
          os.makedirs("data/posts", exist_ok=True)
          
          def clean_text(text):
              if not text:
                  return ""
              text = re.sub(r'<[^>]+>', ' ', text)
              text = re.sub(r'\s+', ' ', text)
              return text.strip()
          
          def get_views(views_elem):
              if not views_elem:
                  return "0"
              text = views_elem.text.strip()
              match = re.search(r'([\d\.]+)(K|k)?', text)
              if match:
                  num = float(match.group(1))
                  if match.group(2) in ('K', 'k'):
                      return str(int(num * 1000))
                  return str(int(num))
              return text
          
          def extract_reactions(msg):
              reactions = []
              # روش جدید: جستجوی مستقیم در کل پیام
              reaction_spans = msg.find_all('span', class_=re.compile('tgme_widget_message_reaction'))
              for react in reaction_spans:
                  emoji = react.find_previous(class_=re.compile('emoji'))
                  if not emoji:
                      continue
                  emoji_text = emoji.get('data-emoji') or emoji.text.strip()
                  count_span = react.find('span', class_=re.compile('count'))
                  count = count_span.text.strip() if count_span else "1"
                  if emoji_text:
                      reactions.append({"emoji": emoji_text, "count": count})
              return reactions
          
          def extract_images(msg):
              images = []
              # روش جدید: جستجوی مستقیم لینک عکس
              # 1. از img داخل پیام
              for img in msg.find_all('img'):
                  src = img.get('src', '')
                  if src and 'user_photo' not in src and 'emoji' not in src:
                      # تبدیل به لینک با کیفیت بالا
                      src = src.replace('//cdn5.telegram-cdn.org', '//cdn5.telesco.pe')
                      images.append(src)
              
              # 2. از background-image در style
              for elem in msg.find_all(style=True):
                  style = elem['style']
                  match = re.search(r'url\(["\']?([^"\'\)]+)["\']?\)', style)
                  if match:
                      img_url = match.group(1)
                      if 'user_photo' not in img_url and 'emoji' not in img_url:
                          images.append(img_url)
              
              # 3. از data-zoom
              for elem in msg.find_all('div', attrs={'data-zoom': True}):
                  img_url = elem['data-zoom']
                  if img_url and 'user_photo' not in img_url:
                      images.append(img_url)
              
              # 4. از data-webp
              for elem in msg.find_all(attrs={'data-webp': True}):
                  img_url = elem['data-webp']
                  if img_url and 'user_photo' not in img_url:
                      images.append(img_url)
              
              return list(dict.fromkeys(images))  # حذف تکراری‌ها
          
          def extract_videos(msg):
              videos = []
              # ویدیوها از تگ video
              for video in msg.find_all('video'):
                  src = video.get('src', '')
                  if src:
                      videos.append(src)
              # از data-video
              for elem in msg.find_all(attrs={'data-video': True}):
                  video_url = elem['data-video']
                  if video_url:
                      videos.append(video_url)
              return videos
          
          def extract_gifs(msg):
              gifs = []
              # گیف‌ها از انیمیشن‌ها
              for video in msg.find_all('video', class_=re.compile('animation')):
                  src = video.get('src', '')
                  if src:
                      gifs.append(src)
              return gifs
          
          for channel in CHANNELS:
              print(f"📡 در حال دریافت: {channel}")
              url = f"https://t.me/s/{channel}"
              
              try:
                  headers = {
                      'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
                  }
                  response = requests.get(url, timeout=30, headers=headers)
                  response.raise_for_status()
                  
                  soup = BeautifulSoup(response.text, 'lxml')
                  posts = []
                  messages = soup.select('.tgme_widget_message')
                  
                  print(f"   یافت شد: {len(messages)} پیام")
                  
                  for msg in messages[:25]:
                      # زمان
                      time_elem = msg.select_one('time')
                      time_str = ""
                      if time_elem:
                          dt_attr = time_elem.get('datetime', '')
                          if dt_attr:
                              try:
                                  dt = datetime.fromisoformat(dt_attr.replace('Z', '+00:00'))
                                  jd = jdatetime.datetime.fromgregorian(datetime=dt)
                                  time_str = f"{jd.year}/{jd.month}/{jd.day} - {jd.hour:02d}:{jd.minute:02d}"
                              except:
                                  time_str = time_elem.text
                          else:
                              time_str = time_elem.text
                      
                      # متن
                      text_elem = msg.select_one('.tgme_widget_message_text')
                      text = clean_text(text_elem.text) if text_elem else ""
                      
                      # بازدید
                      views_elem = msg.select_one('.tgme_widget_message_views')
                      views = get_views(views_elem)
                      
                      # عکس، ویدیو، ری‌اکشن
                      images = extract_images(msg)
                      videos = extract_videos(msg)
                      gifs = extract_gifs(msg)
                      reactions = extract_reactions(msg)
                      
                      if text or images or videos or gifs:
                          posts.append({
                              "id": len(posts) + 1,
                              "time": time_str,
                              "text": text,
                              "views": views,
                              "reactions": reactions,
                              "images": images,
                              "videos": videos,
                              "gifs": gifs
                          })
                          if images:
                              print(f"      عکس پیدا شد: {len(images)}")
                      
                      if len(posts) >= 20:
                          break
                  
                  output = {
                      "channel": channel,
                      "last_update": datetime.now().strftime("%Y-%m-%d %H:%M:%S"),
                      "posts": posts
                  }
                  
                  with open(f"data/posts/{channel}.json", "w", encoding="utf-8") as f:
                      json.dump(output, f, ensure_ascii=False, indent=2)
                  
                  print(f"✅ {channel}: {len(posts)} پست ذخیره شد")
                  print(f"   عکس: {sum(len(p['images']) for p in posts)}")
                  print(f"   ویدیو: {sum(len(p['videos']) for p in posts)}")
                  print(f"   ری‌اکشن: {sum(len(p['reactions']) for p in posts)}")
                  print("")
                  
              except Exception as e:
                  print(f"❌ خطا در {channel}: {str(e)}")
                  print("")
          
          channels_list = {"channels": [{"id": ch, "name": ch} for ch in CHANNELS]}
          with open("data/channels.json", "w", encoding="utf-8") as f:
              json.dump(channels_list, f, ensure_ascii=False, indent=2)
          
          print("🎉 همه چیز با موفقیت انجام شد!")
          EOF
      
      - name: ذخیره در گیت‌هاب
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "به‌روزرسانی خودکار پست‌ها" || echo "تغییری وجود ندارد"
          git push
