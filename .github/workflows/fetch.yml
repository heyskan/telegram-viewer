name: دریافت پست‌های تلگرام

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: نصب کتابخانه‌ها
        run: |
          pip install playwright requests
          python -m playwright install chromium
          python -m playwright install-deps chromium
      
      - name: دریافت پست‌های واقعی از تلگرام
        run: |
          python3 << 'EOF'
          import asyncio
          import json
          import os
          import re
          import hashlib
          import traceback
          from pathlib import Path
          from datetime import datetime
          
          import requests
          from playwright.async_api import async_playwright
          
          # ===========================================
          CHANNELS = ["rodast_omiddana", "iliaen", "proxy_kafee", "alonews"]
          # ===========================================
          
          # ساخت پوشه‌ها
          POSTS_DIR = Path("data/posts")
          MEDIA_DIR = Path("data/media")
          POSTS_DIR.mkdir(parents=True, exist_ok=True)
          MEDIA_DIR.mkdir(parents=True, exist_ok=True)
          
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          }
          
          def is_webm_or_animation(url):
              if not url:
                  return True
              url_lower = url.lower()
              if url_lower.endswith('.webm') or 'animation' in url_lower:
                  return True
              return False
          
          def download_media(url, channel_name, post_id, media_type='photo'):
              if not url or is_webm_or_animation(url):
                  return None
              
              url_hash = hashlib.md5(url.encode()).hexdigest()[:8]
              
              try:
                  resp = requests.get(url, headers=HEADERS, timeout=30)
                  resp.raise_for_status()
                  content_type = resp.headers.get('Content-Type', '').lower()
                  
                  if 'image/' in content_type:
                      ext = '.jpg'
                      if 'png' in content_type:
                          ext = '.png'
                      elif 'webp' in content_type:
                          ext = '.webp'
                      filename = f"{channel_name}_{post_id}_{url_hash}{ext}"
                  elif 'video/mp4' in content_type:
                      filename = f"{channel_name}_{post_id}_{url_hash}.mp4"
                  else:
                      return None
                  
                  local_path = MEDIA_DIR / filename
                  if local_path.exists():
                      return f"data/media/{filename}"
                  
                  local_path.write_bytes(resp.content)
                  print(f"      📥 دانلود شد: {filename}")
                  return f"data/media/{filename}"
                  
              except Exception as e:
                  print(f"      ⚠️ خطا در دانلود: {e}")
                  return None
          
          async def scrape_channel(channel_name):
              print(f"📡 در حال دریافت: {channel_name}")
              url = f"https://t.me/s/{channel_name}"
              
              try:
                  async with async_playwright() as p:
                      browser = await p.chromium.launch(headless=True)
                      page = await browser.new_page()
                      
                      print(f"   🌐 بارگذاری صفحه...")
                      await page.goto(url, wait_until="domcontentloaded", timeout=45000)
                      
                      # منتظر لود شدن پیام‌ها
                      await page.wait_for_timeout(5000)
                      
                      # اسکرول برای لود بیشتر
                      for i in range(8):
                          await page.evaluate("window.scrollTo(0, document.body.scrollHeight)")
                          await page.wait_for_timeout(2000)
                          print(f"   اسکرول {i+1}/8")
                      
                      # دریافت HTML برای دیباگ
                      html = await page.content()
                      if 'tgme_widget_message' not in html:
                          print(f"   ⚠️ ساختار صفحه تغییر کرده! پیامی پیدا نشد.")
                          await browser.close()
                          return []
                      
                      # استخراج داده‌ها
                      messages_data = await page.evaluate("""() => {
                          const messages = [];
                          const containers = document.querySelectorAll('[data-post]');
                          
                          for (const el of containers) {
                              const dataPost = el.getAttribute('data-post');
                              if (!dataPost) continue;
                              const parts = dataPost.split('/');
                              if (parts.length < 2) continue;
                              const channel = parts[0];
                              const postId = parseInt(parts[1]);
                              if (isNaN(postId)) continue;
                              
                              // زمان
                              const timeEl = el.querySelector('time');
                              let timeStr = '';
                              if (timeEl) {
                                  timeStr = timeEl.getAttribute('datetime') || timeEl.innerText;
                              }
                              
                              // متن
                              const textEl = el.querySelector('.tgme_widget_message_text');
                              let text = '';
                              if (textEl) {
                                  text = textEl.innerHTML;
                                  text = text.replace(/<br\s*\/?>/gi, '\\n');
                                  text = text.replace(/<[^>]+>/g, '');
                                  text = text.replace(/&nbsp;/g, ' ');
                                  text = text.replace(/&amp;/g, '&');
                                  text = text.trim();
                              }
                              
                              // بازدید
                              const viewsEl = el.querySelector('.tgme_widget_message_views');
                              let views = viewsEl ? viewsEl.innerText : '0';
                              
                              // عکس‌ها
                              const images = [];
                              const imgTag = el.querySelector('.tgme_widget_message_photo img');
                              if (imgTag && imgTag.src && !imgTag.src.includes('user_photo')) {
                                  images.push(imgTag.src);
                              }
                              
                              // ویدیوها
                              const videos = [];
                              const videoTag = el.querySelector('video');
                              if (videoTag && videoTag.src && !videoTag.src.includes('.webm')) {
                                  videos.push(videoTag.src);
                              }
                              
                              // ری‌اکشن‌ها
                              const reactions = [];
                              const reactionDivs = el.querySelectorAll('.tgme_widget_message_reaction');
                              for (const react of reactionDivs) {
                                  const emojiEl = react.querySelector('.tgme_widget_message_reaction_emoji');
                                  const countEl = react.querySelector('.tgme_widget_message_reaction_count');
                                  if (emojiEl) {
                                      reactions.push({
                                          emoji: emojiEl.innerText,
                                          count: countEl ? countEl.innerText : '1'
                                      });
                                  }
                              }
                              
                              messages.push({
                                  id: postId,
                                  time: timeStr,
                                  text: text,
                                  views: views,
                                  images: images,
                                  videos: videos,
                                  reactions: reactions
                              });
                          }
                          
                          // مرتب‌سازی بر اساس ID (جدیدترین اول)
                          messages.sort((a, b) => b.id - a.id);
                          return messages;
                      }""")
                      
                      await browser.close()
                      print(f"   ✅ {len(messages_data)} پیام استخراج شد")
                      return messages_data
                      
              except Exception as e:
                  print(f"   ❌ خطا در اسکرپ {channel_name}: {str(e)}")
                  traceback.print_exc()
                  return []
          
          async def main():
              for channel in CHANNELS:
                  print(f"\n{'='*50}")
                  print(f"پردازش کانال: {channel}")
                  print(f"{'='*50}")
                  
                  raw_messages = await scrape_channel(channel)
                  
                  if not raw_messages:
                      print(f"   ⚠️ هیچ پیامی برای {channel} یافت نشد")
                      continue
                  
                  posts = []
                  for msg in raw_messages[:30]:
                      downloaded_images = []
                      for img_url in msg.get('images', []):
                          if img_url:
                              local_path = download_media(img_url, channel, msg['id'], 'photo')
                              if local_path:
                                  downloaded_images.append(local_path)
                      
                      downloaded_videos = []
                      for vid_url in msg.get('videos', []):
                          if vid_url:
                              local_path = download_media(vid_url, channel, msg['id'], 'video')
                              if local_path:
                                  downloaded_videos.append(local_path)
                      
                      posts.append({
                          "id": msg["id"],
                          "time": msg["time"],
                          "text": msg["text"],
                          "views": msg["views"],
                          "reactions": msg.get("reactions", []),
                          "images": downloaded_images,
                          "videos": downloaded_videos
                      })
                  
                  output = {
                      "channel": channel,
                      "last_update": datetime.now().strftime("%Y-%m-%d %H:%M:%S"),
                      "posts": posts
                  }
                  
                  with open(POSTS_DIR / f"{channel}.json", "w", encoding="utf-8") as f:
                      json.dump(output, f, ensure_ascii=False, indent=2)
                  
                  print(f"✅ {channel}: {len(posts)} پست ذخیره شد")
                  print(f"   عکس: {sum(len(p['images']) for p in posts)}")
                  print(f"   ویدیو: {sum(len(p['videos']) for p in posts)}")
                  print(f"   ری‌اکشن: {sum(len(p['reactions']) for p in posts)}")
              
              # ذخیره لیست کانال‌ها
              channels_list = {"channels": [{"id": ch, "name": ch} for ch in CHANNELS]}
              with open("data/channels.json", "w", encoding="utf-8") as f:
                  json.dump(channels_list, f, ensure_ascii=False, indent=2)
              
              print("\n🎉 همه چیز با موفقیت انجام شد!")
          
          asyncio.run(main())
          EOF
      
      - name: ذخیره در گیت‌هاب
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "به‌روزرسانی خودکار پست‌ها" || echo "تغییری وجود ندارد"
          git push
