name: دریافت پست‌های تلگرام

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: نصب کتابخانه‌ها
        run: |
          pip install playwright requests jdatetime
          python -m playwright install chromium
          python -m playwright install-deps chromium
      
      - name: دریافت پست‌های واقعی از تلگرام با Playwright
        run: |
          python3 << 'EOF'
          import asyncio
          import json
          import os
          import re
          import time
          from pathlib import Path
          from datetime import datetime
          
          import jdatetime
          import requests
          from playwright.async_api import async_playwright
          
          # ===========================================
          CHANNELS = ["rodast_omiddana", "iliaen", "proxy_kafee", "alonews"]
          # ===========================================
          
          os.makedirs("data/posts", exist_ok=True)
          
          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          }
          
          def clean_text(text):
              if not text:
                  return ""
              text = re.sub(r'\s+', ' ', text)
              return text.strip()
          
          async def scrape_channel(channel_name):
              print(f"📡 در حال دریافت: {channel_name}")
              url = f"https://t.me/s/{channel_name}"
              
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True)
                  page = await browser.new_page()
                  
                  await page.goto(url, wait_until="networkidle", timeout=30000)
                  
                  try:
                      await page.wait_for_selector("[data-post]", timeout=15000)
                  except:
                      print(f"   ❌ پیامی پیدا نشد")
                      await browser.close()
                      return []
                  
                  # اسکرول برای لود بیشتر
                  for _ in range(5):
                      await page.evaluate("window.scrollTo(0, document.body.scrollHeight)")
                      await asyncio.sleep(2)
                  
                  # استخراج داده‌ها با جاوااسکریپت داخل مرورگر
                  messages_data = await page.evaluate("""() => {
                      const messages = [];
                      const containers = document.querySelectorAll('[data-post]');
                      
                      containers.forEach(el => {
                          const dataPost = el.getAttribute('data-post');
                          if (!dataPost) return;
                          const parts = dataPost.split('/');
                          if (parts.length < 2) return;
                          const channel = parts[0];
                          const postId = parseInt(parts[1]);
                          if (isNaN(postId)) return;
                          
                          // زمان
                          const timeEl = el.querySelector('time');
                          let timeStr = '';
                          if (timeEl) {
                              const dt = timeEl.getAttribute('datetime');
                              if (dt) timeStr = dt;
                              else timeStr = timeEl.innerText;
                          }
                          
                          // متن
                          const textEl = el.querySelector('.tgme_widget_message_text');
                          const text = textEl ? textEl.innerText : '';
                          
                          // بازدید
                          const viewsEl = el.querySelector('.tgme_widget_message_views');
                          let views = '0';
                          if (viewsEl) views = viewsEl.innerText;
                          
                          // عکس‌ها
                          const images = [];
                          const photoWrap = el.querySelector('.tgme_widget_message_photo_wrap');
                          if (photoWrap) {
                              const style = photoWrap.getAttribute('style') || '';
                              const match = style.match(/url\\(['"]?(.*?)['"]?\\)/);
                              if (match) images.push(match[1]);
                          }
                          
                          // ویدیوها
                          const videos = [];
                          const videoTag = el.querySelector('video');
                          if (videoTag && videoTag.src && !videoTag.src.startsWith('blob:')) {
                              videos.push(videoTag.src);
                          }
                          
                          // ری‌اکشن‌ها
                          const reactions = [];
                          const reactionDivs = el.querySelectorAll('.tgme_widget_message_reaction');
                          reactionDivs.forEach(react => {
                              const emojiEl = react.querySelector('.tgme_widget_message_reaction_emoji');
                              const countEl = react.querySelector('.tgme_widget_message_reaction_count');
                              if (emojiEl) {
                                  reactions.push({
                                      emoji: emojiEl.innerText,
                                      count: countEl ? countEl.innerText : '1'
                                  });
                              }
                          });
                          
                          messages.push({
                              id: postId,
                              time: timeStr,
                              text: text,
                              views: views,
                              images: images,
                              videos: videos,
                              reactions: reactions
                          });
                      });
                      
                      return messages;
                  }""")
                  
                  await browser.close()
                  
                  print(f"   یافت شد: {len(messages_data)} پیام")
                  return messages_data
          
          def convert_time(dt_str):
              if not dt_str:
                  return ""
              try:
                  # تبدیل ISO format به شمسی
                  dt = datetime.fromisoformat(dt_str.replace('Z', '+00:00'))
                  jd = jdatetime.datetime.fromgregorian(datetime=dt)
                  return f"{jd.year}/{jd.month}/{jd.day} - {jd.hour:02d}:{jd.minute:02d}"
              except:
                  return dt_str
          
          async def main():
              all_posts = {}
              
              for channel in CHANNELS:
                  raw_messages = await scrape_channel(channel)
                  
                  posts = []
                  for msg in raw_messages[:20]:
                      posts.append({
                          "id": msg["id"],
                          "time": convert_time(msg["time"]),
                          "text": clean_text(msg["text"]),
                          "views": msg["views"],
                          "reactions": msg["reactions"],
                          "images": msg["images"],
                          "videos": msg["videos"],
                          "gifs": []
                      })
                      
                      if posts and posts[-1]["images"]:
                          print(f"      عکس پیدا شد: {len(posts[-1]['images'])}")
                      if posts and posts[-1]["videos"]:
                          print(f"      ویدیو پیدا شد: {len(posts[-1]['videos'])}")
                      if posts and posts[-1]["reactions"]:
                          print(f"      ری‌اکشن پیدا شد: {len(posts[-1]['reactions'])}")
                  
                  output = {
                      "channel": channel,
                      "last_update": datetime.now().strftime("%Y-%m-%d %H:%M:%S"),
                      "posts": posts
                  }
                  
                  with open(f"data/posts/{channel}.json", "w", encoding="utf-8") as f:
                      json.dump(output, f, ensure_ascii=False, indent=2)
                  
                  print(f"✅ {channel}: {len(posts)} پست ذخیره شد")
                  print(f"   عکس: {sum(len(p['images']) for p in posts)}")
                  print(f"   ویدیو: {sum(len(p['videos']) for p in posts)}")
                  print(f"   ری‌اکشن: {sum(len(p['reactions']) for p in posts)}")
                  print("")
              
              # ذخیره لیست کانال‌ها
              channels_list = {"channels": [{"id": ch, "name": ch} for ch in CHANNELS]}
              with open("data/channels.json", "w", encoding="utf-8") as f:
                  json.dump(channels_list, f, ensure_ascii=False, indent=2)
              
              print("🎉 همه چیز با موفقیت انجام شد!")
          
          asyncio.run(main())
          EOF
      
      - name: ذخیره در گیت‌هاب
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "به‌روزرسانی خودکار پست‌ها" || echo "تغییری وجود ندارد"
          git push
