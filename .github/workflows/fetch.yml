name: دریافت پست‌های تلگرام

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: نصب کتابخانه‌ها
        run: |
          pip install requests jdatetime beautifulsoup4
      
      - name: دریافت پست‌های واقعی از تلگرام
        run: |
          python3 << 'EOF'
          import json, requests, os, re
          from bs4 import BeautifulSoup
          from datetime import datetime
          import jdatetime
          
          # ===========================================
          CHANNELS = ["rodast_omiddana", "iliaen", "proxy_kafee", "alonews"]
          # ===========================================
          
          os.makedirs("data/posts", exist_ok=True)
          
          def clean_text(text):
              if not text:
                  return ""
              # حذف تگ‌های HTML و نرمال‌سازی
              text = re.sub(r'<[^>]+>', ' ', text)
              # فشرده‌سازی فاصله‌ها (چند فاصله به یک فاصله)
              text = re.sub(r'\s+', ' ', text)
              return text.strip()
          
          def get_views(views_elem):
              if not views_elem:
                  return "0"
              text = views_elem.text.strip()
              if 'K' in text or 'k' in text:
                  try:
                      num = float(re.findall(r'[\d\.]+', text)[0])
                      return str(int(num * 1000))
                  except:
                      return text
              return text
          
          def extract_reactions(msg):
              reactions = []
              reactions_div = msg.select_one('.tgme_widget_message_reactions')
              if reactions_div:
                  for react in reactions_div.select('.tgme_widget_message_reaction'):
                      emoji_elem = react.select_one('.tgme_widget_message_reaction_emoji')
                      count_elem = react.select_one('.tgme_widget_message_reaction_count')
                      if emoji_elem:
                          emoji = emoji_elem.get('data-emoji', '') or emoji_elem.text.strip()
                          count = count_elem.text.strip() if count_elem else "1"
                          if emoji:
                              reactions.append({"emoji": emoji, "count": count})
              return reactions
          
          def extract_images(msg):
              images = []
              photo_div = msg.select_one('.tgme_widget_message_photo')
              if photo_div:
                  img = photo_div.select_one('img')
                  if img and img.get('src'):
                      src = img['src']
                      if 'user_photo' not in src and 'emoji' not in src:
                          images.append(src)
              return images
          
          for channel in CHANNELS:
              print(f"📡 در حال دریافت: {channel}")
              url = f"https://t.me/s/{channel}"
              
              try:
                  headers = {
                      'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'
                  }
                  response = requests.get(url, timeout=30, headers=headers)
                  response.raise_for_status()
                  
                  soup = BeautifulSoup(response.text, 'html.parser')
                  posts = []
                  messages = soup.select('.tgme_widget_message')
                  
                  for msg in messages[:20]:
                      # زمان
                      time_elem = msg.select_one('time')
                      time_str = ""
                      if time_elem:
                          datetime_attr = time_elem.get('datetime', '')
                          if datetime_attr:
                              try:
                                  dt = datetime.fromisoformat(datetime_attr.replace('Z', '+00:00'))
                                  jd = jdatetime.datetime.fromgregorian(datetime=dt)
                                  time_str = f"{jd.year}/{jd.month}/{jd.day} - {jd.hour:02d}:{jd.minute:02d}"
                              except:
                                  time_str = time_elem.text
                          else:
                              time_str = time_elem.text
                      
                      # متن
                      text_elem = msg.select_one('.tgme_widget_message_text')
                      text = clean_text(text_elem.text) if text_elem else ""
                      
                      # بازدید
                      views_elem = msg.select_one('.tgme_widget_message_views')
                      views = get_views(views_elem)
                      
                      # عکس
                      images = extract_images(msg)
                      
                      # ری‌اکشن
                      reactions = extract_reactions(msg)
                      
                      if text or images:
                          posts.append({
                              "id": len(posts) + 1,
                              "time": time_str,
                              "text": text,
                              "views": views,
                              "reactions": reactions,
                              "images": images,
                              "videos": []
                          })
                  
                  output = {
                      "channel": channel,
                      "last_update": datetime.now().strftime("%Y-%m-%d %H:%M:%S"),
                      "posts": posts
                  }
                  
                  with open(f"data/posts/{channel}.json", "w", encoding="utf-8") as f:
                      json.dump(output, f, ensure_ascii=False, indent=2)
                  
                  print(f"✅ {channel}: {len(posts)} پست ذخیره شد")
                  
              except Exception as e:
                  print(f"❌ خطا در {channel}: {str(e)}")
          
          channels_list = {"channels": [{"id": ch, "name": ch} for ch in CHANNELS]}
          with open("data/channels.json", "w", encoding="utf-8") as f:
              json.dump(channels_list, f, ensure_ascii=False, indent=2)
          
          print("\n🎉 همه چیز با موفقیت انجام شد!")
          EOF
      
      - name: ذخیره در گیت‌هاب
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "به‌روزرسانی خودکار پست‌ها" || echo "تغییری وجود ندارد"
          git push
